<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Agriculture Borewell</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .form-container {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-bottom: 20px;
      color: #003366;
    }
    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button[type="submit"] {
      background: #003366;
      color: #fff;
    }
    button[type="submit"]:hover {
      background: #00599c;
    }
    .back-button {
      background: #ccc;
      color: #333;
    }
    .back-button:hover {
      background: #aaa;
    }
    .calendar-container {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    .calendar-day {
      font-weight: bold;
    }
    .calendar-date {
      padding: 8px;
      cursor: pointer;
      border-radius: 4px;
    }
    .calendar-date.available {
      background-color: #d4edda;
    }
    .calendar-date.filling-fast {
      background-color: #fff3cd;
    }
    .calendar-date.full-quota,
    .calendar-date.past-date {
      background-color: #f8d7da;
      color: #721c24;
      cursor: not-allowed;
    }
    .calendar-date.selected {
      border: 2px solid #007bff;
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      font-size: 0.9em;
    }
    .legend-item {
      display: flex;
      align-items: center;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div id="header"></div>

  <div class="form-container">
    <h1>Book Agriculture Borewell</h1>
    <form id="agriForm">
      <div class="calendar-container">
        <div class="calendar-header">
          <button type="button" id="prevMonth">Prev</button>
          <h2 id="monthYear"></h2>
          <button type="button" id="nextMonth">Next</button>
        </div>
        <div class="calendar-grid" id="calendar">
          <div class="calendar-day">S</div>
          <div class="calendar-day">M</div>
          <div class="calendar-day">T</div>
          <div class="calendar-day">W</div>
          <div class="calendar-day">T</div>
          <div class="calendar-day">F</div>
          <div class="calendar-day">S</div>
        </div>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="legend-color" style="background-color: #d4edda;"></span>Available</div>
        <div class="legend-item"><span class="legend-color" style="background-color: #fff3cd;"></span>Filling Fast</div>
        <div class="legend-item"><span class="legend-color" style="background-color: #f8d7da;"></span>Quota is Full</div>
      </div>

      <input type="hidden" id="selectedDateInput" required>

      <label for="village">Village/Town:</label>
      <input type="text" id="village" name="village" placeholder="Enter village or town" required>

      <label for="town">Near Town Area:</label>
      <input type="text" id="town" name="town" placeholder="Enter nearest town area" required>

      <button type="submit">Confirm Booking</button>
      <button type="button" class="back-button" onclick="window.history.back()">Back</button>
    </form>
  </div>

  <div id="footer"></div>

  <script>
    // Load header and footer components
    async function loadComponent(id, file) {
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`Failed to load ${file}`);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
      } catch (error) {
        console.error(error);
      }
    }

    loadComponent("header", "../partials/customer_header.html");
    loadComponent("footer", "../partials/customer_footer.html");

    // Handle form submit
    document.getElementById("agriForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const selectedDate = document.getElementById("selectedDateInput").value;
      if (!selectedDate) {
        alert("Please select a date from the calendar.");
        return;
      }

      const bookingData = {
        customerId: localStorage.getItem("customerId"),
        type: "Agriculture",
        date: selectedDate,
        village: document.getElementById("village").value,
        town: document.getElementById("town").value
      };

      try {
        const res = await fetch("/api/customer/book-bore", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bookingData)
        });

        const data = await res.json();

        if (res.ok) {
          alert("🎉 Congratulations! Your booking is confirmed. You can view details on the My Bookings page.");
          // ✅ re-render calendar after booking
          if (typeof window.renderCalendar === "function") {
            window.renderCalendar();
          }
          window.location.href = "mybookings.html";
        } else {
          alert("❌ Error: " + (data.message || "Something went wrong. Please try again."));
        }
      } catch (error) {
        alert("❌ Network Error: " + error.message);
      }
    });
  </script>

  <!-- Calendar logic -->
  <script src="calendar.js?type=Agriculture"></script>
</body>
</html>
